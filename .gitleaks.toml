# Gitleaks configuration — extends default rules with project-specific keys.
[extend]
useDefault = true

[[rules]]
id = "funpay-api-key"
description = "Funpay API key (платные LLM-модели)"
regex = '''Funpay_[A-Za-z0-9]{20,}'''
secretGroup = 0
entropy = 3.0

[[rules]]
id = "omniroute-jwt-secret"
description = "OmniRoute JWT/API секрет в скриптах восстановления"
regex = '''(JWT_SECRET|API_KEY_SECRET)\s*=\s*["']?[A-Za-z0-9+/=_-]{24,}'''
secretGroup = 0
entropy = 3.0

# Артефакты аудита: JSON-отчёт gitleaks (secrets redacted) и трекер ротации
# (все ключи там уже скомпрометированы и усечены — задокументированы намеренно)
[allowlist]
paths = [
    '''^reports/gitleaks-.*\.json$''',
    '''^SECRETS_ROTATION\.md$''',
]
