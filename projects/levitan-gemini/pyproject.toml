[project]
name = "levitan-gemini"
version = "0.1.0"
description = "Levitan вариант 2: Gemini Live (speech-to-speech) на LiveKit Agents"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E741", "E501", "W293"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["agent"]
