<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="soft"><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feComposite in="soft" in2="SourceGraphic" operator="over"/>
    </filter>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F3EC"/><stop offset="0.55" stop-color="#F3EFE7"/><stop offset="1" stop-color="#E7DFD3"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#paper)"/>
  <g opacity="0.45" stroke="#D8CEC0" stroke-width="1" fill="none">
    <path d="M40 470 C 210 420, 300 500, 470 452 S 700 400, 800 430"/>
    <path d="M120 120 C 240 160, 320 96, 430 130"/>
  </g>
  <rect width="1200" height="630" filter="url(#grain)" fill="#000000" opacity="0.03"/>
  <rect x="840" y="0" width="360" height="630" fill="#B95433"/>
  <text x="72" y="96" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="5" fill="#23211F">AI BUREAU</text>
  <text x="68" y="392" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="800" letter-spacing="-5" fill="#23211F">ГРАНИЦА</text>
  <rect x="74" y="428" width="742" height="8" fill="#B95433"/>
  <rect x="840" y="428" width="360" height="8" fill="#F7F3EC"/>
  <text x="74" y="500" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#3D3833">между ответом на вопрос</text>
  <text x="74" y="545" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#3D3833">и действием в системе</text>
  <text x="1020" y="330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="800" letter-spacing="-4" fill="#FFFFFF">3</text>
  <text x="1020" y="384" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" letter-spacing="3" fill="#FFFFFF">ЗОНЫ РЕШЕНИЙ</text>
  <text x="74" y="588" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="1" fill="#6B6359">ai-bureau.online</text>
</svg>
