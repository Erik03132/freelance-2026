# WireGuard CLIENT config for the Mac.
# 1) Generate keys on Mac:  wg genkey | tee ~/mac_wg_private | wg pubkey
# 2) Send the PUBLIC key to the server script (wireguard_server.sh <PUB>).
# 3) Fill <MAC_PRIVATE_KEY> (from ~/mac_wg_private) and <SERVER_PUBLIC_KEY> below.
# 4) Install client:  brew install wireguard-tools
# 5) Connect:  sudo wg-quick up ./wireguard_mac.conf
# 6) Test:     ssh -o StrictHostKeyChecking=no root@10.0.0.1 'echo OK_VPN'
#
# NOTE: AllowedIPs = 10.0.0.1/32 means ONLY the VPS goes through the tunnel.
# Your normal Mac internet is untouched (no proxy/redirect).

[Interface]
Address = 10.0.0.2/24
PrivateKey = <MAC_PRIVATE_KEY>
# No DNS / no redirect — minimal, safe.

[Peer]
PublicKey = <SERVER_PUBLIC_KEY>
Endpoint = 217.149.23.113:51820
AllowedIPs = 10.0.0.1/32
PersistentKeepalive = 25
