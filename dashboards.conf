server {
    listen 443 ssl;
    server_name 217.149.23.113;

    ssl_certificate     /etc/nginx/ssl/levitan.crt;
    ssl_certificate_key /etc/nginx/ssl/levitan.key;

    # Basic auth (password = OmniRoute INITIAL_PASSWORD)
    auth_basic "Hermes/Omni dashboards";
    auth_basic_user_file /etc/nginx/conf.d/dashboards.htpasswd;

    # Hermes Agent web dashboard (systemd: hermes-dashboard @ :9120)
    location /hermes/ {
        proxy_pass http://127.0.0.1:9120/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # OmniRoute custom dashboard
    location = /omni/ {
        alias /var/www/html/omni_dashboard.html;
        default_type text/html;
    }
    location /omni/api/ {
        proxy_pass http://127.0.0.1:8890/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
